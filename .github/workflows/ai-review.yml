# AI-ревью pull request'ов через AgentsCore («День 32»).
#
# Скопируйте файл в репозиторий: .github/workflows/ai-review.yml
#
# Настройки репозитория (Settings → Secrets and variables → Actions):
#   secrets.AGENTSCORE_URL   — адрес AgentsCore, например https://<домен>/core/
#                              (через прокси agents_proxy) или http://<сервер>:8000/
#   secrets.AGENTSCORE_KEY   — ключ доступа прокси (пусто — без заголовка Authorization)
#   vars.AGENTSCORE_AGENT    — имя агента-ревьюера (или vars.AGENTSCORE_AGENT_ID — его id)
#
# Как работает: событие PR → POST /dev/reviews (координаты PR: репозиторий,
# номер, базовая ветка, коммит) → опрос GET /dev/reviews/{id} → один
# комментарий в PR (при новых коммитах он обновляется). Diff, база знаний и
# модель — на стороне AgentsCore и mcp_server; код PR здесь не скачивается и
# не выполняется.
#
# pull_request_target: workflow берётся из базовой ветки и получает секреты и
# право комментировать даже для PR из форков. Это безопасно, потому что код
# PR не checkout'ится и не запускается — в AgentsCore уходят только номер PR
# и ссылка на репозиторий.

name: AI review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Номер pull request'а"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Новый пуш в PR отменяет ещё идущее ревью предыдущего коммита.
  group: ai-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: AI review
        env:
          AGENTSCORE_URL: ${{ secrets.AGENTSCORE_URL }}
          AGENTSCORE_KEY: ${{ secrets.AGENTSCORE_KEY }}
          AGENTSCORE_AGENT: ${{ vars.AGENTSCORE_AGENT }}
          AGENTSCORE_AGENT_ID: ${{ vars.AGENTSCORE_AGENT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          REVIEW_TIMEOUT_MIN: "15"
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          MARKER = "<!-- agentscore-review -->"
          env = os.environ
          core = env["AGENTSCORE_URL"].rstrip("/") + "/"
          repo, number = env["REPO"], int(env["PR_NUMBER"])

          def call(url, method="GET", body=None, headers=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
              req.add_header("Content-Type", "application/json")
              req.add_header("Accept", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  text = exc.read().decode(errors="replace")
                  try:
                      text = json.loads(text).get("error") or text
                  except ValueError:
                      pass
                  raise RuntimeError(f"HTTP {exc.code}: {text}") from None

          gh_headers = {"Authorization": f"Bearer {env['GITHUB_TOKEN']}", "X-GitHub-Api-Version": "2022-11-28"}
          core_headers = {"Authorization": f"Bearer {env['AGENTSCORE_KEY']}"} if env.get("AGENTSCORE_KEY") else {}

          def gh(path, method="GET", body=None):
              return call(f"{env['API_URL']}{path}", method, body, gh_headers)

          def upsert_comment(text):
              body = f"{MARKER}\n{text}"
              comments = gh(f"/repos/{repo}/issues/{number}/comments?per_page=100")
              mine = next((c for c in comments if MARKER in (c.get("body") or "")), None)
              if mine:
                  gh(f"/repos/{repo}/issues/comments/{mine['id']}", "PATCH", {"body": body})
              else:
                  gh(f"/repos/{repo}/issues/{number}/comments", "POST", {"body": body})

          pr = gh(f"/repos/{repo}/pulls/{number}")
          request = {
              "repo": f"{env['SERVER_URL']}/{repo}", "pr": number, "base": pr["base"]["ref"],
              "head_sha": pr["head"]["sha"], "title": pr.get("title"), "author": (pr.get("user") or {}).get("login"),
              "url": pr.get("html_url"),
          }
          if env.get("AGENTSCORE_AGENT_ID"):
              request["agent_id"] = env["AGENTSCORE_AGENT_ID"]
          else:
              request["agent"] = env.get("AGENTSCORE_AGENT") or "Ревьюер"

          try:
              started = call(core + "dev/reviews", "POST", request, core_headers)
              print(f"Ревью {started['review_id']} в чате «{started['chat_title']}»")
              deadline = time.time() + int(env.get("REVIEW_TIMEOUT_MIN", "15")) * 60
              while True:
                  result = call(core + f"dev/reviews/{started['review_id']}", headers=core_headers)
                  if result.get("status") != "running":
                      break
                  if time.time() > deadline:
                      raise RuntimeError("ревью не завершилось за отведённое время")
                  if result.get("current_status"):
                      print("…", result["current_status"])
                  time.sleep(10)
          except Exception as exc:  # noqa: BLE001
              upsert_comment(f"## AI-ревью\n\nРевью не выполнено: {exc}")
              print(f"::warning::AI-ревью не выполнено: {exc}")
              sys.exit(0)

          if result["status"] == "cancelled":
              print("Ревью отменено: в PR пришёл более новый коммит")
              sys.exit(0)
          if result["status"] != "done":
              upsert_comment(f"## AI-ревью\n\nРевью не выполнено: {result.get('error') or result['status']}")
              print(f"::warning::AI-ревью не выполнено: {result.get('error')}")
              sys.exit(0)
          upsert_comment(result["comment_markdown"])
          print(f"Баги: {len(result['bugs'])}, архитектура: {len(result['architecture'])}, "
                f"рекомендации: {len(result['recommendations'])}")
          PY
